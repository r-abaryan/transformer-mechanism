<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="760" viewBox="0 0 1050 760" role="img">
<title>ReLU and SwiGLU: final paired perplexity</title>
<desc>Two panels show final validation and reused test perplexity. Lower is better. Both FFNs have 1056 weights and projection MACs per token per block. Validation determines adoption; test is descriptive.</desc>
<rect width="1050" height="760" fill="white"/>
<text x="30" y="32" font-family="Arial,sans-serif" font-size="23" fill="#243449">ReLU33 versus SwiGLU22: equal FFN projection cost</text>
<text x="30" y="59" font-family="Arial,sans-serif" font-size="14" fill="#243449">MQA; width16; two blocks; bias-free FFNs; three paired seeds; 6,000 updates; context64.</text>
