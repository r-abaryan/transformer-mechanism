<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="365" viewBox="0 0 1140 365" role="img" aria-labelledby="title desc">
<title id="title">Compact reader resource tradeoffs at batch 32</title>
<desc id="desc">Measured state payload grows with context for softmax and stays fixed for delta. Eager delta prefill is slower; retained-state query is faster. Bars show ranges of nine seed and process medians for timings.</desc>
