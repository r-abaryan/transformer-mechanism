<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="760" viewBox="0 0 1050 760" role="img">
<title>LayerNorm and RMSNorm: final paired perplexity</title>
<desc>Two panels show final validation and reused test perplexity. Lower is better. Both arms use gain-only normalization and equal parameters. Validation determines adoption; test is descriptive.</desc>
