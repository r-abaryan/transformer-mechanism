<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="760" viewBox="0 0 1050 760" role="img">
<title>Untied and tied word matrices: final paired perplexity</title>
<desc>Two panels show final validation and reused test perplexity. Lower is better. Tying shares input and output word weights; training budget is equal. Validation determines adoption; test is descriptive.</desc>
