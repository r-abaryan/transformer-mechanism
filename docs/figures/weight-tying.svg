<text x="30" y="32" font-family="Arial,sans-serif" font-size="23" fill="#243449">Word matrices: independent versus shared weights</text>
<text x="30" y="59" font-family="Arial,sans-serif" font-size="14" fill="#243449">MQA; width16; two blocks; LayerNorm; ReLU/FFN32; three paired seeds; 6,000 updates; context64.</text>
<text x="30" y="87" font-family="Arial,sans-serif" font-size="14" fill="#0072b2">Untied</text>
<text x="160" y="87" font-family="Arial,sans-serif" font-size="14" fill="#d55e00">Tied</text>
